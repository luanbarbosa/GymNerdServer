<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Data</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --error: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h2 { font-size: 16px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  button {
    align-self: flex-start;
    padding: 8px 16px;
    font-size: 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .status { font-size: 13px; white-space: pre-line; }
  .status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Exercise Data</h1>

  <section>
    <h2>Break by type</h2>
    <p>Upload exercises.json. Downloads one &lt;type&gt;.json per exercise type.</p>
    <input type="file" id="splitInput" accept=".json,application/json">
    <button id="splitBtn" disabled>Break by type</button>
    <div id="splitStatus" class="status"></div>
  </section>

  <section>
    <h2>Merge</h2>
    <p>Upload the per-type files. Downloads a single exercises.json.</p>
    <input type="file" id="mergeInput" accept=".json,application/json" multiple>
    <button id="mergeBtn" disabled>Merge</button>
    <div id="mergeStatus" class="status"></div>
  </section>
</main>
<script src="exercise-data.js"></script>
</body>
</html>
