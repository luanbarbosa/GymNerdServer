<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise Viewer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #38383a;
      --accent: #2997ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    padding: 16px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  #status { color: var(--muted); font-size: 14px; }
  button {
    padding: 8px 16px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type="number"] { width: 80px; }
  input[type="number"], select {
    padding: 7px 8px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 1), minmax(0, 1fr));
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .card .img-wrap {
    flex: 1;
    min-height: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .missing { color: #999; font-size: 13px; }
  .card .info { padding: 10px 12px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-all; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
  .card .actions button { padding: 5px 10px; font-size: 12px; }
  .card.problem { border-color: #e5484d; box-shadow: 0 0 0 2px #e5484d; }
  .card.problem button.mark { background: #e5484d; border-color: #e5484d; color: #fff; }
  #toast {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #problems-dialog {
    width: min(640px, calc(100vw - 32px));
    max-height: calc(100vh - 64px);
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
  }
  #problems-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  #problems-dialog .dialog-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #problems-dialog h2 { font-size: 16px; margin: 0; flex: 1; }
  #problems-list { list-style: none; margin: 0; padding: 8px 16px; overflow-y: auto; }
  #problems-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  #problems-list li:last-child { border-bottom: none; }
  #problems-list .row-text { flex: 1; min-width: 0; }
  #problems-list .row-name { font-size: 14px; font-weight: 600; }
  #problems-list .row-id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  #problems-list button { padding: 5px 10px; font-size: 12px; }
  #problems-list .empty { color: var(--muted); justify-content: center; border: none; }
</style>
</head>
<body>
<header>
  <h1>Exercise Viewer</h1>
  <span id="status">Loading…</span>
  <button id="prev">Previous</button>
  <button id="next" class="primary">Next</button>
  <label>Go to # <input id="jump" type="number" min="1"></label>
  <label>Per page
    <select id="page-size">
      <option>1</option><option>2</option><option>3</option><option selected>4</option>
      <option>6</option><option>8</option><option>12</option><option>16</option><option>24</option>
    </select>
  </label>
  <button id="show-problems">Show problems</button>
  <button id="export">Export problems (0)</button>
  <button id="clear">Clear problems</button>
</header>
<div id="grid"></div>
<div id="toast"></div>
<dialog id="problems-dialog">
  <div class="dialog-header">
    <h2 id="problems-title">Problematic exercises</h2>
    <button id="copy-all">Copy all</button>
    <button id="close-problems">Close</button>
  </div>
  <ul id="problems-list"></ul>
</dialog>

<script>
  const CATALOG_URL = "https://gymnerd-catalog.pages.dev";
  const PAGE_SIZE_KEY = "gymnerd.pageSize";
  let pageSize = 4;
  try {
    pageSize = Number(localStorage.getItem(PAGE_SIZE_KEY)) || 4;
  } catch {}

  let exercises = [];
  let offset = 0;

  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const jumpInput = document.getElementById("jump");
  const exportBtn = document.getElementById("export");
  const clearBtn = document.getElementById("clear");
  const toast = document.getElementById("toast");
  const pageSizeSelect = document.getElementById("page-size");

  const PROBLEMS_KEY = "gymnerd.problemExerciseIds";
  let problems = loadProblems();

  function loadProblems() {
    try {
      return JSON.parse(localStorage.getItem(PROBLEMS_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveProblems() {
    try {
      localStorage.setItem(PROBLEMS_KEY, JSON.stringify(problems));
    } catch {
      showToast("Could not save to localStorage");
    }
    exportBtn.textContent = `Export problems (${problems.length})`;
  }

  function toggleProblem(id) {
    problems = problems.includes(id) ? problems.filter((x) => x !== id) : [...problems, id];
    saveProblems();
    render();
  }

  let toastTimer;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
  }

  async function copy(text, label) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }
    showToast(`Copied ${label}: ${text}`);
  }

  function actionButton(label, onClick, className) {
    const button = document.createElement("button");
    button.textContent = label;
    if (className) button.className = className;
    button.onclick = onClick;
    return button;
  }

  const problemsDialog = document.getElementById("problems-dialog");
  const problemsList = document.getElementById("problems-list");
  const problemsTitle = document.getElementById("problems-title");

  function renderProblemsList() {
    problemsTitle.textContent = `Problematic exercises (${problems.length})`;
    problemsList.innerHTML = "";
    if (!problems.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "No problematic exercises marked.";
      problemsList.appendChild(empty);
      return;
    }
    problems.forEach((id) => {
      const index = exercises.findIndex((e) => e.id === id);
      const exercise = exercises[index];

      const row = document.createElement("li");
      const text = document.createElement("div");
      text.className = "row-text";
      const name = document.createElement("div");
      name.className = "row-name";
      name.textContent = exercise ? `${index + 1}. ${exercise.name}` : "Unknown exercise";
      const idText = document.createElement("div");
      idText.className = "row-id";
      idText.textContent = id;
      text.append(name, idText);

      row.append(text, actionButton("Copy", () => copy(id, "exercise id")));
      if (exercise) {
        row.append(actionButton("Go to", () => {
          problemsDialog.close();
          goTo(index - (index % pageSize));
        }));
      }
      row.append(actionButton("Remove", () => {
        toggleProblem(id);
        renderProblemsList();
      }));
      problemsList.appendChild(row);
    });
  }

  function render() {
    grid.innerHTML = "";
    const page = exercises.slice(offset, offset + pageSize);
    page.forEach((exercise, i) => {
      const card = document.createElement("div");
      const isProblem = problems.includes(exercise.id);
      card.className = isProblem ? "card problem" : "card";

      const imgWrap = document.createElement("div");
      imgWrap.className = "img-wrap";
      if (exercise.imageFileId) {
        const img = document.createElement("img");
        img.src = `${CATALOG_URL}/images/${exercise.imageFileId}.webp`;
        img.alt = exercise.name;
        img.onerror = () => { imgWrap.innerHTML = '<span class="missing">Image failed to load</span>'; };
        imgWrap.appendChild(img);
      } else {
        imgWrap.innerHTML = '<span class="missing">No image</span>';
      }

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = `${offset + i + 1}. ${exercise.name}`;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [exercise.namePT, exercise.type].filter(Boolean).join(" · ");
      info.append(name, meta);

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        actionButton("Copy exercise id", () => copy(exercise.id, "exercise id")),
        actionButton("Copy image id", () => copy(exercise.imageFileId || "", "image id")),
        actionButton(isProblem ? "Problematic ✓" : "Mark as problematic", () => toggleProblem(exercise.id), "mark"),
      );

      card.append(imgWrap, info, actions);
      grid.appendChild(card);
    });

    const end = Math.min(offset + pageSize, exercises.length);
    status.textContent = `${offset + 1}–${end} of ${exercises.length}`;
    prevBtn.disabled = offset === 0;
    nextBtn.disabled = end >= exercises.length;
    history.replaceState(null, "", `#${offset + 1}`);
  }

  function goTo(newOffset) {
    const maxOffset = Math.max(0, exercises.length - 1);
    offset = Math.min(Math.max(0, newOffset), maxOffset);
    render();
  }

  function updateGridShape() {
    let cols = pageSize % 4 === 0 ? 4 : pageSize % 3 === 0 ? 3 : Math.min(pageSize, 4);
    if (window.innerWidth <= 480) cols = 1;
    else if (window.innerWidth <= 900) cols = Math.min(cols, 2);
    grid.style.setProperty("--cols", cols);
    grid.style.setProperty("--rows", Math.ceil(pageSize / cols));
  }
  window.addEventListener("resize", updateGridShape);

  function applyPageSize() {
    pageSizeSelect.value = String(pageSize);
    updateGridShape();
  }
  pageSizeSelect.onchange = () => {
    pageSize = Number(pageSizeSelect.value);
    try {
      localStorage.setItem(PAGE_SIZE_KEY, String(pageSize));
    } catch {}
    applyPageSize();
    goTo(offset - (offset % pageSize));
  };
  applyPageSize();

  prevBtn.onclick = () => goTo(offset - pageSize);
  nextBtn.onclick = () => goTo(offset + pageSize);
  jumpInput.onchange = () => goTo(Number(jumpInput.value) - 1);
  document.getElementById("show-problems").onclick = () => {
    renderProblemsList();
    problemsDialog.showModal();
  };
  document.getElementById("close-problems").onclick = () => problemsDialog.close();
  problemsDialog.onclick = (e) => { if (e.target === problemsDialog) problemsDialog.close(); };
  document.getElementById("copy-all").onclick = () => {
    if (problems.length) copy(problems.join(","), `${problems.length} ids`);
  };
  exportBtn.onclick = () => {
    const blob = new Blob([problems.join("\n") + (problems.length ? "\n" : "")], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "problem-images.txt";
    link.click();
    URL.revokeObjectURL(link.href);
  };
  clearBtn.onclick = () => {
    if (!problems.length || !window.confirm(`Clear ${problems.length} problematic exercise ids?`)) return;
    problems = [];
    saveProblems();
    render();
  };
  saveProblems();
  document.addEventListener("keydown", (e) => {
    if (e.target === jumpInput || e.target === pageSizeSelect || problemsDialog.open) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); if (!nextBtn.disabled) nextBtn.click(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); if (!prevBtn.disabled) prevBtn.click(); }
  });

  fetch(`${CATALOG_URL}/exercises.json`, { cache: "no-store" })
    .then((res) => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then((data) => {
      exercises = data;
      const start = parseInt(location.hash.slice(1), 10);
      goTo(Number.isFinite(start) ? start - 1 : 0);
    })
    .catch((err) => { status.textContent = `Failed to load exercises: ${err.message}`; });
</script>
</body>
</html>
